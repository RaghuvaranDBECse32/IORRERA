<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simulation Game of Orreus....</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Mobile Responsive -->
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./button.css">
  <link rel="stylesheet" href="./tilt-buttons.css"> <!-- For Tilt Buttons -->
</head>
<body>

<!-- Home Button -->
<div class="button-container">
  <a href="https://raghuvarandbecse32.github.io/Chronicalc/" class="button" target="_blank">Home</a>
</div>

<!-- Game Wrapper -->
<div class="wrapper">
  <div class="game_space loading">
    <div class="canvasWrapper"></div>
    <div class="messaging"></div>
  </div>
  <div class="score_display hidden">Score: <span class="score">0</span></div>
  <div class="level_display hidden">Level: <span class="level">_</span></div>
  <div class="loading_font" aria-hidden="true">&nbsp;</div>
</div>

<!-- Tilt Control Buttons (Mobile-Friendly) -->
<div class="tilt-controls">
  <button class="tilt-btn" onclick="tiltUp()">⬆️ Tilt Up</button>
  <button class="tilt-btn" onclick="tiltDown()">⬇️ Tilt Down</button>
</div>

<script src="./script.js"></script>
<script>
  function tiltUp() {
    alert("Tilting Up (custom logic here)");
    // Add your game tilt-up logic
  }

  function tiltDown() {
    alert("Tilting Down (custom logic here)");
    // Add your game tilt-down logic
  }
</script>

</body>
</html>
